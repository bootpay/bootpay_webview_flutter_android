plugins {
    id 'com.android.library'
}

// AGP 9+ 는 Kotlin 을 내장한다(Built-in Kotlin). 앱이 android.builtInKotlin=false 로 끈 경우와
// AGP 8 이하에서만 KGP 를 적용한다.
// - Groovy 의 `?:` 는 false 도 비어 있다고 보므로 getOrElse 로 읽는다.
// - `apply plugin:` 표기는 Flutter 의 KGP 감지 정규식에 조건과 무관하게 잡히므로 pluginManager 로 적용한다.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlinEnabled = agpMajor >= 9 &&
    providers.gradleProperty('android.builtInKotlin').getOrElse('true').toBoolean()
if (!builtInKotlinEnabled) {
    pluginManager.apply('org.jetbrains.kotlin.android')
}

group = 'kr.co.bootpay.webviewflutter'
version = '1.0-SNAPSHOT'

android {
    namespace = "kr.co.bootpay.webviewflutter"
    // Use flutter.compileSdkVersion with fallback to 34 for older projects
    compileSdk = project.hasProperty('flutter') && flutter.hasProperty('compileSdkVersion')
        ? flutter.compileSdkVersion
        : 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        checkAllWarnings = true
        warningsAsErrors = true
        disable 'AndroidGradlePluginVersion', 'InvalidPackage', 'GradleDependency', 'NewerVersionAvailable'
        baseline = file("lint-baseline.xml")
    }

    dependencies {
        // Use Kotlin 1.7.x compatible versions for maximum compatibility
        implementation("androidx.annotation:annotation:1.5.0")
        implementation("androidx.webkit:webkit:1.14.0")
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.3.1")
        testImplementation("org.mockito:mockito-inline:5.2.0")
        testImplementation("androidx.test:core:1.5.0")
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// kotlin { compilerOptions } 는 KGP 2.0+ 에서만 있다. 오래된 앱(KGP 1.x)은 기존 kotlinOptions 를 쓴다.
def kgpMajor = builtInKotlinEnabled ? 2 :
    org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt.getKotlinPluginVersion(project).tokenize('.')[0].toInteger()
if (kgpMajor >= 2) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}
